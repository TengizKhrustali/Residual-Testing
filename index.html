<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residual Method Testing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .input-box { @apply w-full bg-white border border-blue-300 rounded p-2 text-lg font-bold focus:ring-2 focus:ring-blue-500 outline-none; }
        .calc-display { @apply w-full bg-gray-100 border border-gray-300 rounded p-2 text-lg font-mono text-gray-700; }
        .label-style { @apply block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1; }
    </style>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden border border-gray-200">
        <div class="bg-blue-900 p-6 text-white text-center">
            <h1 class="text-2xl font-black italic tracking-tighter">RESIDUAL METHOD TESTING TEMPLATE</h1>
        </div>

        <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="space-y-6">
                <h2 class="text-blue-700 font-bold border-b pb-2">📂 USER INPUTS</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="label-style">Land Area (m²)</label>
                        <input type="number" id="in_area" value="1000" oninput="calc()" class="input-box text-blue-800">
                    </div>
                    <div>
                        <label class="label-style">K2 Coefficient</label>
                        <input type="number" id="in_k2" value="2.5" step="0.1" oninput="calc()" class="input-box text-blue-800">
                    </div>
                    <div>
                        <label class="label-style">Costs per m² (Net)</label>
                        <input type="number" id="in_cost_m2" value="300" oninput="calc()" class="input-box">
                    </div>
                    <div>
                        <label class="label-style">Flat Price per m² (Net)</label>
                        <input type="number" id="in_f_price" value="1400" oninput="calc()" class="input-box">
                    </div>
                    <div>
                        <label class="label-style">Comm. Price per m² (Net)</label>
                        <input type="number" id="in_c_price" value="1400" oninput="calc()" class="input-box">
                    </div>
                    <div>
                        <label class="label-style">Parking Unit Price (Net)</label>
                        <input type="number" id="in_p_price" value="6000" oninput="calc()" class="input-box">
                    </div>
                </div>
            </div>

            <div class="space-y-6 bg-slate-50 p-6 rounded-lg">
                <h2 class="text-green-700 font-bold border-b pb-2">📊 CALCULATED FIELDS</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="label-style">Buildable Area K2</label>
                        <div id="out_k2" class="calc-display font-bold">0</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="label-style text-[8px]">Flat Area</label>
                            <div id="out_flat" class="calc-display text-sm italic font-medium">0</div>
                        </div>
                        <div>
                            <label class="label-style text-[8px]">Commercial</label>
                            <div id="out_comm" class="calc-display text-sm italic font-medium">0</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="label-style text-[8px]">Air</label>
                            <div id="out_air" class="calc-display text-xs">0</div>
                        </div>
                        <div>
                            <label class="label-style text-[8px]">Stairs</label>
                            <div id="out_stair" class="calc-display text-xs">0</div>
                        </div>
                        <div>
                            <label class="label-style text-[8px]">Parking (Units)</label>
                            <div id="out_park" class="calc-display text-xs">0</div>
                        </div>
                    </div>

                    <div class="mt-8 pt-4 border-t border-gray-300">
                        <label class="label-style text-blue-900">Total Residual Land Value</label>
                        <div id="res_land" class="text-4xl font-black text-blue-900">$0</div>
                    </div>
                    
                    <div class="mt-4 p-3 bg-white rounded border border-gray-200">
                        <div class="flex justify-between text-[10px] font-bold uppercase"><span class="text-gray-400">Total Rev:</span><span id="res_rev"></span></div>
                        <div class="flex justify-between text-[10px] font-bold uppercase mt-1"><span class="text-gray-400">Build Costs:</span><span id="res_costs" class="text-red-500"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PROFIT_RATE = 0.30;
        const fmt = (v) => '$' + Math.round(v).toLocaleString();

        function calc() {
            // INPUTS
            const area = +document.getElementById('in_area').value;
            const k2 = +document.getElementById('in_k2').value;
            const bCost = +document.getElementById('in_cost_m2').value;
            const fP = +document.getElementById('in_f_price').value;
            const cP = +document.getElementById('in_c_price').value;
            const pP = +document.getElementById('in_p_price').value;

            // FORMULAS (Calculated Fields)
            const k2Area = area * k2;
            const flat = k2Area * 0.80; // Assuming 80% distribution
            const comm = k2Area * 0.10;
            const air = k2Area * 0.05;
            const stair = k2Area * 0.05;
            const totalBuild = flat + comm + air + stair;
            const parkUnits = Math.floor(flat / 60);

            // FINANCIALS
            const totalRev = (flat * fP) + (comm * cP) + (parkUnits * pP);
            const buildCosts = totalBuild * bCost;
            const profit = totalRev * PROFIT_RATE;
            const residual = totalRev - buildCosts - profit;

            // UPDATE UI
            document.getElementById('out_k2').innerText = Math.round(k2Area).toLocaleString() + ' m²';
            document.getElementById('out_flat').innerText = Math.round(flat).toLocaleString();
            document.getElementById('out_comm').innerText = Math.round(comm).toLocaleString();
            document.getElementById('out_air').innerText = Math.round(air).toLocaleString();
            document.getElementById('out_stair').innerText = Math.round(stair).toLocaleString();
            document.getElementById('out_park').innerText = parkUnits;

            document.getElementById('res_rev').innerText = fmt(totalRev);
            document.getElementById('res_costs').innerText = '-' + fmt(buildCosts);
            document.getElementById('res_land').innerText = fmt(residual);
        }
        calc();
    </script>
</body>
</html>
